<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Phil's Players - dash.js</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
  <script src="js/site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>

  <!-- DashJS Latest -->
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <!-- JQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
</head>

<body class="bg-paper font-sans text-ink antialiased">
  <div class="mx-auto max-w-3xl px-5 sm:px-8">

    <header class="flex items-center justify-between gap-4 py-5">
      <a href="index.html" class="rounded-sm text-lg font-extrabold tracking-tight font-stretch-expanded focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Phil's Players</a>
      <nav class="flex items-center gap-1 text-sm font-medium">
        <a href="index.html" class="rounded-sm px-2 py-1 text-muted hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">All players</a>
        <button type="button" data-theme-toggle class="inline-flex items-center gap-2 rounded-sm px-2 py-1 text-muted hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
          <span data-theme-toggle-label>Dark</span>
        </button>
      </nav>
    </header>

    <main class="pt-6 pb-12 sm:pt-10">
      <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-3">
        <h1 class="text-4xl leading-none font-extrabold tracking-tight font-stretch-expanded sm:text-5xl">dash.js</h1>
        <p class="flex text-xs font-medium text-muted"><span class="w-12 rounded-[2px] border border-current/40 py-0.5 text-center">DASH</span></p>
      </div>

      <form id="playform" class="mt-8">
        <label for="manifest" class="block text-sm font-semibold">DASH manifest URL</label>
        <div class="mt-2 flex flex-col gap-2 sm:flex-row">
          <input type="url" id="manifest" name="manifest" placeholder="https://example.com/stream.mpd" spellcheck="false" autocomplete="off" class="min-w-0 flex-1 rounded-sm border border-rule bg-panel px-3 py-2.5 font-mono text-sm placeholder:text-muted/70 focus:border-ink focus:outline-none">
          <button type="button" id="play-button" class="rounded-sm bg-amber px-6 py-2.5 font-semibold sm:w-36 text-amber-ink hover:bg-amber-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Play</button>
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-x-1 gap-y-2 text-sm">
          <span class="mr-1 text-muted">Or try</span>
          <button type="button" id="demo-button" class="rounded-sm border border-rule px-2.5 py-1 font-medium hover:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">DASH demo</button>
        </div>
      </form>

      <figure class="mt-8">
        <div class="rounded-md bg-black p-1.5">
          <div class="aspect-video overflow-hidden rounded-sm">
            <video id="example" class="h-full w-full" controls autoplay></video>
          </div>
        </div>
        <figcaption data-tally data-state="idle" class="group mt-4 flex items-stretch rounded-sm bg-black text-white">
          <span class="w-1.5 shrink-0 rounded-l-sm bg-white/15 transition-colors group-data-[state=loading]:bg-tally-green group-data-[state=paused]:bg-tally-green group-data-[state=playing]:bg-tally-red group-data-[state=error]:bg-amber"></span>
          <span class="flex flex-1 items-center justify-between gap-4 px-3 py-2">
            <span class="font-semibold font-stretch-condensed">dash.js <span id="player-version" class="ml-1 font-normal text-white/70"></span></span>
            <span data-tally-label class="text-sm text-white/70">Idle</span>
          </span>
        </figcaption>
      </figure>

      <div class="mt-6 max-w-[38rem] text-sm leading-relaxed text-muted">
        <p>The DASH Industry Forum reference player, latest stable release. <a href="https://github.com/Dash-Industry-Forum/dash.js/wiki" class="font-medium text-ink underline decoration-rule decoration-2 underline-offset-4 hover:decoration-ink">dash.js documentation</a></p>
      </div>
    </main>

    <footer class="border-t border-rule py-6 text-sm text-muted">
      <p>&copy; <a href="https://philcluff.co.uk" class="underline decoration-rule underline-offset-4 hover:text-ink">Phil Cluff</a> &amp; <a href="https://github.com/philcluff/phils-players#authors" class="underline decoration-rule underline-offset-4 hover:text-ink">The Authors</a> 2015&ndash;2026.</p>
    </footer>

  </div>

  <script>
    var video = document.querySelector("#example");
    var player = dashjs.MediaPlayer().create();
    player.initialize(video, null, true);

    $("#player-version").text('v' + player.getVersion());

    $( "#play-button" ).click(function() {
      player.attachSource($( "#manifest" ).val());
    });

    $( "#demo-button" ).click(function() {
      $( "#manifest" ).val("https://d1czxfd0hfd9km.cloudfront.net/outputs/bbb/mediaconvert/dash/bbb.mpd");
      $( "#play-button" ).trigger( "click" );
    });
  </script>
</body>
</html>
